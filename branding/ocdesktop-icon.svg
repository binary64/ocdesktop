<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5cff"/>
      <stop offset="0.55" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#5f33e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <!-- Claw mark: three parallel slashes, centre longest, fanned 26deg -->
  <g transform="rotate(26 512 512)" fill="#ffffff">
    <rect x="336" y="318" width="78" height="388" rx="39"/>
    <rect x="473" y="286" width="78" height="452" rx="39"/>
    <rect x="610" y="318" width="78" height="388" rx="39"/>
  </g>
</svg>
